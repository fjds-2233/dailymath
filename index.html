<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日一题 · 大屏入口</title>
<style>
  :root{
    --bg:#07111f;
    --panel:#0f2236;
    --line:rgba(125,180,220,.25);
    --text:#f3f7fb;
    --muted:#a9bacb;
    --gold:#f5c451;
    --cyan:#57d6d0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    min-height:100%;
    display:grid;place-items:center;
    padding:32px;
    font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;
    color:var(--text);
    background:
      radial-gradient(1100px 600px at 12% -10%, rgba(33,92,140,.30), transparent 62%),
      radial-gradient(900px 500px at 100% 110%, rgba(20,110,100,.20), transparent 62%),
      var(--bg);
  }
  .wrap{width:min(1100px,100%);}
  .top{
    display:flex;align-items:baseline;gap:18px;
    padding-bottom:18px;margin-bottom:24px;
    border-bottom:1px solid var(--line);
  }
  h1{font-size:clamp(36px,4.2vw,64px);line-height:1;color:var(--gold);letter-spacing:.06em;}
  .sub{font-size:clamp(16px,1.4vw,24px);color:var(--muted);}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  a.card{
    display:flex;flex-direction:column;gap:10px;
    min-height:220px;padding:28px 30px;
    text-decoration:none;color:var(--text);
    background:linear-gradient(180deg,rgba(15,34,54,.97),rgba(9,22,37,.97));
    border:1px solid var(--line);border-radius:20px;
    transition:transform .15s ease,border-color .15s ease;
  }
  a.card:hover{transform:translateY(-3px);border-color:rgba(87,214,208,.65);}
  .tag{font-size:16px;color:var(--cyan);letter-spacing:.08em;}
  .title{font-size:clamp(26px,2.6vw,40px);font-weight:800;color:var(--gold);}
  .desc{font-size:clamp(16px,1.5vw,24px);line-height:1.6;color:var(--muted);}
  .foot{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:#7c93a6;}
  @media (max-width:760px){
    .cards{grid-template-columns:1fr;}
    a.card{min-height:160px;}
  }
</style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <h1>每日一题</h1>
      <div class="sub">班级大屏 · 选择题组进入</div>
    </header>

    <section class="cards">
      <a class="card" href="1/">
        <span class="tag">题组 1</span>
        <span class="title">进入大屏</span>
        <span class="desc">题干 + 选项 + 答案显隐；向下滑动进入知识点背诵。</span>
      </a>
      <a class="card" href="2/">
        <span class="tag">题组 2</span>
        <span class="title">进入大屏</span>
        <span class="desc">题干 + 选项 + 答案显隐；向下滑动进入知识点背诵。</span>
      </a>
    </section>

    <div class="foot">答案默认隐藏；按空格或点击“显示答案”查看。解析不上大屏。</div>
  </main>
</body>
</html>
