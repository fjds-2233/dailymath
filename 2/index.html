<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日一题 · 2026-10-08</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#0f172a;color:#e8eefc;
display:flex;flex-direction:column;padding:1.2vh 1.4vw;gap:1vh}
header{display:flex;align-items:baseline;gap:1.6vw;border-bottom:.35vh solid #22335c;padding-bottom:1vh}
h1{font-size:clamp(28px,3.4vw,64px);color:#ffd54a;letter-spacing:.06em}
.meta{font-size:clamp(14px,1.15vw,24px);color:#9fb3d9}
.topic{font-size:clamp(15px,1.25vw,26px);color:#5fd0c0;border:1px solid #2c4a44;background:#12241f;
border-radius:6px;padding:.5vh .9vw;align-self:center;margin-left:auto}
main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2vh;min-height:0}
.stem{font-size:clamp(26px,2.7vw,56px);line-height:1.5}
table{border-collapse:collapse;font-size:clamp(20px,2vw,42px);margin:1vh auto}
td{border:1px solid #3b5480;padding:.6vh 1.4vw;text-align:center;color:#e8eefc}
tr:first-child td{background:#16233f;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 2vw;font-size:clamp(22px,2.35vw,48px)}
.opt{background:#141f38;border:1px solid #26375c;border-radius:8px;padding:1.1vh 1.2vw}
.opt b{color:#7fc4ff;margin-right:.6vw}
footer{border-top:.35vh solid #22335c;padding-top:1vh}
#btn{font-size:clamp(15px,1.25vw,26px);background:#1d4ed8;color:#fff;border:0;border-radius:8px;
padding:1vh 1.6vw;cursor:pointer}
.ans{display:none;margin-top:1vh;font-size:clamp(17px,1.5vw,30px);line-height:1.6}
.ans.on{display:block}
.akey{color:#ffd54a;font-weight:700}
.ans ol{margin-left:1.6em}
</style>
</head>
<body>
<header>
  <h1>每日一题</h1>
  <div class="meta">2026-10-08　|　微信公众号：锤子数学</div>
  <div class="topic">概率 · 随机游走 · 分类讨论</div>
</header>
<main>
  <div class="stem">一个质点在随机外力的作用下从原点 O 出发，每次等可能地向左或向右移动一个单位，共移动 8 次，则下列说法正确的是（　　）</div>
  
  <div class="stem"></div>
  <div class="opts"><div class="opt"><b>A.</b>质点回到原点的概率为 1/2</div><div class="opt"><b>B.</b>质点回到原点的概率为 1/512</div><div class="opt"><b>C.</b>质点位于 6 的位置的概率为 1/16</div><div class="opt"><b>D.</b>质点位于 6 的位置的概率为 1/32</div></div>
</main>
<footer>
  <button id="btn" onclick="document.getElementById('ans').classList.toggle('on');this.textContent=this.textContent.includes('显示')?'隐藏答案':'显示答案'">显示答案</button>
  <div class="ans" id="ans"><div class="akey">答案：D</div></div>
</footer>
<script>document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();document.getElementById('btn').click();}});</script>
</body>
</html>
