var CLS = '06';
var m = /[?&]c=(11|6)\b/.exec(location.search);
if (m) { CLS = (m[1] === '11') ? '11' : '06'; }
var STATIC = /[?&]static\b/.test(location.search);

// 默认落在最新一天的那一屏（第二天上课直接打开就是这个），按 → 翻到它的 P3
var idx = Math.max(0, PAGES.length - 2), timers = [], left = 180, running = false;

function $(id){ return document.getElementById(id); }
function clearTimers(){ for (var i=0;i<timers.length;i++){ clearTimeout(timers[i]); } timers = []; }
function pad(n){ return n < 10 ? '0' + n : '' + n; }

function render(){
  var p = PAGES[idx];
  $('tag').innerHTML = p.side;
  $('tag').className = 'tag' + (p.side === 'P2' ? ' p2' : '');
  $('title').innerHTML = p.topic;
  $('sub').innerHTML = p.sub;
  var rows = (CLS === '11') ? p.rows11 : p.rows06;
  var lay  = (CLS === '11') ? p.lay11 : p.lay06;
  var box = $('rows');
  box.innerHTML = '';
  for (var i=0;i<rows.length;i++){
    var d = document.createElement('div');
    d.className = 'row';
    d.innerHTML = '<div class="q">问：' + rows[i][0] + '</div>' +
                  '<div class="a">——答：' + rows[i][1] + '</div>';
    box.appendChild(d);
  }
  $('layh').innerHTML = (CLS === '11') ? '🚀 11 班 · 一句进阶' : '💡 06 班 · 一句保底';
  var ul = '';
  for (var j=0;j<lay.length;j++){ ul += '<li>' + lay[j] + '</li>'; }
  $('layl').innerHTML = ul;
  $('pg').innerHTML = (idx+1) + ' / ' + PAGES.length + '　·　' + p.date;
  play();
}

function revealAll(){
  var rows = document.querySelectorAll('.row');
  for (var i=0;i<rows.length;i++){ rows[i].className = 'row on'; }
  var as = document.querySelectorAll('.a');
  for (var j=0;j<as.length;j++){ as[j].className = 'a on'; }
}

function play(){
  clearTimers();
  var rows = document.querySelectorAll('.row');
  var i = 0;
  function step(){
    if (i >= rows.length) { return; }
    rows[i].className = 'row on';
    (function(node){
      timers.push(setTimeout(function(){ node.className = 'a on'; }, 2200));
    })(rows[i].querySelector('.a'));
    i++;
    if (i < rows.length) { timers.push(setTimeout(step, 8800)); }
  }
  step();
}

function tick(){
  if (!running) { return; }
  if (left <= 0) { $('veil').style.display = 'block'; return; }
  left--;
  var c = $('clock');
  c.innerHTML = pad(Math.floor(left/60)) + ':' + pad(left%60);
  if (left <= 30) { c.className = 'warn'; }
  timers.push(setTimeout(tick, 1000));
}

document.onkeydown = function(e){
  e = e || window.event;
  var k = e.keyCode;
  if (k === 39 || k === 34) { if (idx < PAGES.length-1) { idx++; render(); } }
  else if (k === 37 || k === 33) { if (idx > 0) { idx--; render(); } }
  else if (k === 32) { if (e.preventDefault) { e.preventDefault(); } revealAll(); }
};

$('go').onclick = function(){
  $('start').style.display = 'none';
  running = true;
  render();
  tick();
};

var pm = /[?&]p=(\d+)/.exec(location.search);
if (pm) { idx = Math.max(0, Math.min(PAGES.length - 1, parseInt(pm[1], 10) - 1)); }

if (STATIC) {
  $('start').style.display = 'none';
  render();
  revealAll();
  $('clock').innerHTML = '02:55';
}
</script>
